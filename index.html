<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Экран загрузки</title>
    <!-- Подключаем крутой жирный шрифт от Google -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Russo One', sans-serif;
        }

        /* Задний фон с картинкой */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Указываем точное название твоей картинки */
            background-image: url('994310423996056894.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
            /* Слегка затемняем фон, чтобы текст читался лучше */
            filter: brightness(0.6); 
        }

        /* Контейнер для текста по центру */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            width: 100%;
        }

        /* Крутая светящаяся надпись */
        h1 {
            color: #ffffff;
            font-size: 4.5vw; /* Размер адаптируется под экран */
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            /* Неоновое зелено-синее свечение под стиль свина */
            text-shadow: 0 0 10px #00ff40, 0 0 20px #00ff40, 0 0 40px #00aaff, 0 0 80px #00aaff;
            animation: pulse 2s infinite alternate;
        }

        /* Анимация пульсации текста */
        @keyframes pulse {
            0% { 
                text-shadow: 0 0 10px #00ff40, 0 0 20px #00ff40, 0 0 40px #00aaff; 
                transform: scale(1); 
            }
            100% { 
                text-shadow: 0 0 20px #00ff40, 0 0 40px #00ff40, 0 0 60px #00aaff, 0 0 100px #00aaff; 
                transform: scale(1.05); 
            }
        }

        /* Текст статуса загрузки файлов */
        #status {
            color: #cccccc;
            font-size: 24px;
            margin-top: 30px;
            text-shadow: 1px 1px 5px #000000;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="background"></div>
    
    <div class="content">
        <h1>Добро пожаловать<br>на наш сервер</h1>
        <div id="status">Подключение к серверу...</div>
    </div>

    <!-- Скрипты для связи с движком Garry's Mod -->
    <script>
        // Эта функция срабатывает, когда качается конкретный файл аддона
        function DownloadingFile( fileName ) {
            document.getElementById('status').innerText = "Скачивание: " + fileName;
        }
        
        // Эта функция срабатывает при смене статуса (например "Sending client info")
        function SetStatusChanged( status ) {
            document.getElementById('status').innerText = status;
        }
    </script>

</body>
</html>
